<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clan Leaderboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f; /* Black background */
            color: #fff; /* White text for general content */
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #fff; /* White title */
        }

        .clan-section {
            background-color: #fff; /* Keep the original white background for the clan sections */
            margin: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .clan-section h2 {
            display: inline-block;
            margin-right: 10px;
            margin-left: 10px;
            color: #fff; /* White text for clan names */
        }

        .clan-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 15px; /* Space between logo and name */
        }

        .player-list {
            margin-top: 15px;
            padding: 0;
            list-style-type: none;
            display: none;
        }

        .player-list li {
            padding: 5px;
            font-size: 16px;
        }

        .player-name {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
        }

        img.rank-badge {
            width: 40px;
            height: 40px;
            vertical-align: middle;
            margin-left: 10px;
        }

        .dropdown-button {
            cursor: pointer;
            padding: 5px;
            font-size: 16px;
            font-weight: bold;
            background-color: transparent;
            border: none;
            text-align: left;
            color: #fff; /* White text for buttons */
        }

        .dropdown-button:after {
            content: '\25BC'; /* Down arrow */
            margin-left: 10px;
        }

        .dropdown-button.open:after {
            content: '\25B2'; /* Up arrow */
        }

        .clan-stats {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff; /* White background for the stats section */
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333; /* Keep the text color for stats */
        }

        .mvp {
            font-weight: bold;
            color: #d9534f; /* MVP color */
        }

        .role {
            font-style: italic;
            color: #fff; /* Keep role text white */
        }
    </style>
</head>
<body>

    <h1>Clan Leaderboard</h1>
    <div id="leaderboard"></div>

    <script>
        // Fetch the leaderboard data from the JSON file
        fetch('leaderboard.json')
            .then(response => response.json())
            .then(data => {
                let leaderboard = document.getElementById('leaderboard');

                // Clan logo filenames based on clan names
                const clanLogos = {
                    "Great Personality": "Great Personality Logo.png",
                    "WANGHAF": "WANGHAF Logo.png",
                    "Beer Pressure": "Beer Pressure Logo.png",
                    "Six Eyes": "Six Eyes Logo.png"
                };

                // Rank badge filenames based on rank
                const rankBadges = {
                    "Champion": "champion.png",
                    "Master": "master.png",
                    "Diamond I": "diamond.png",
                    "Diamond II": "diamond.png",
                    "Diamond III": "diamond.png",
                    "Platinum I": "platinum.png",
                    "Platinum II": "platinum.png",
                    "Gold II": "gold.png",
                    "Gold III": "gold.png",
                    "Silver I": "silver.png",
                    "Silver II": "silver.png" // Same badge for Silver I and II
                };

                // Role assignments for players
                const playerRoles = {
                    "Matt Latour": "Clan Leader",
                    "Deshaun W": "GM",
                    "Jordan Lusk": "Commissioner",
                    "Davis Bjornstad": "Clan Leader",
                    "Gurp Singh": "Clan Leader",
                    "Charlie Steel": "Clan Leader"
                };

                // Function to calculate the clan's stats
                function getClanStats(clanName) {
                    let totalElo = 0;
                    let totalWins = 0;
                    let totalGames = 0;
                    let totalLosses = 0;
                    let mvp = null;
                    let highestMVPScore = 0;

                    data.players.filter(player => player.clan === clanName).forEach(player => {
                        totalElo += player.elo;
                        totalWins += player.wins;
                        totalGames += player.games;
                        totalLosses += player.losses;

                        // Calculate win percentage
                        let winPercentage = (player.games > 0) ? (player.wins / player.games) * 100 : 0;

                        // Add weighting based on number of games played
                        let gamesPlayedWeight = player.games > 5 ? 1 : (player.games / 5); // Weight is 1 for players with 5 or more games, otherwise scaled
                        let mvpScore = (winPercentage * gamesPlayedWeight);

                        // Update MVP if this player has a higher score
                        if (mvpScore > highestMVPScore) {
                            highestMVPScore = mvpScore;
                            mvp = player.name; // Update MVP based on highest score
                        }
                    });

                    const averageElo = totalGames > 0 ? (totalElo / totalGames).toFixed(2) : 0;
                    const winPercentage = totalGames > 0 ? ((totalWins / totalGames) * 100).toFixed(2) : 0;

                    return {
                        totalElo,
                        averageElo,
                        totalGames,
                        totalWins,
                        totalLosses,
                        winPercentage,
                        mvp
                    };
                }

                // Iterate over the clans and display them
                data.clans.forEach(clan => {
                    let clanSection = document.createElement('section');
                    clanSection.classList.add('clan-section');

                    // Construct the logo path
                    let logoPath = `Icons/${clanLogos[clan.name]}`;

                    // Get clan stats
                    let stats = getClanStats(clan.name);

                    clanSection.innerHTML = `
                        <h2 style="color: ${clan.color};">
                            <img class="clan-logo" src="${logoPath}" alt="${clan.name} Logo">${clan.name}
                        </h2>

                        <div class="clan-stats">
                            <p><strong>Total Elo:</strong> ${stats.totalElo}</p>
                            <p><strong>Average Elo:</strong> ${stats.averageElo}</p>
                            <p><strong>Total Games:</strong> ${stats.totalGames}</p>
                            <p><strong>Total Wins:</strong> ${stats.totalWins}</p>
                            <p><strong>Total Losses:</strong> ${stats.totalLosses}</p>
                            <p><strong>Win %:</strong> ${stats.winPercentage}%</p>
                            <p><strong>MVP:</strong> <span class="mvp">${stats.mvp}</span></p>
                        </div>

                        <button class="dropdown-button" onclick="toggleDropdown(event)">Players</button>
                        <ul class="player-list">
                            ${data.players.filter(player => player.clan === clan.name)
                                          .map(player => {
                                              const role = playerRoles[player.name] ? `<span class="role" style="color: ${clan.color};">(${playerRoles[player.name]})</span>` : '';
                                              return `
                                                <li style="color: ${clan.color};">
                                                    <img class="rank-badge" src="Icons/${rankBadges[player.tier]}" alt="${player.tier} Badge">
                                                    <span class="player-name">${player.name} ${role}</span>
                                                </li>`;
                                          }).join('')}
                        </ul>
                    `;
                    leaderboard.appendChild(clanSection);
                });
            })
            .catch(error => console.error('Error loading leaderboard data:', error));

        // Function to toggle the visibility of the player list
        function toggleDropdown(event) {
            const button = event.target;
            const playerList = button.nextElementSibling; // The <ul> element

            playerList.style.display = playerList.style.display === 'none' || playerList.style.display === '' ? 'block' : 'none';
            button.classList.toggle('open'); // Toggle the dropdown arrow
        }
    </script>

</body>
</html>
