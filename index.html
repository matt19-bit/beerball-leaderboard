<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beerball Player Cards</title>

  <style>
    /* Overall Card */
    .player-card {
      width: 300px;
      height: 650px;
      background: #181818;
      color: white;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Banner Section (customizable) */
    .banner {
      position: relative;
      width: 100%;
      height: 160px;
      background-color: rgb(255, 22, 22); /* Default red color for "Champion" */
      text-align: center;
    }
    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
    }

    /* Player Name, Clan, Team */
    .player-name {
      position: absolute;
      top: 20px;
      width: 100%;
      font-size: 20px;
      font-weight: bold;
      color: white;
    }

    .clan-team {
      position: absolute;
      top: 50px;
      width: 100%;
      font-size: 14px;
      color: #b0b0b0;
      text-align: center;
    }

    .clan-name {
      display: block;
      font-weight: bold;
      color: #fff;
    }

    .team-name {
      font-style: italic;
      margin-top: 5px;
      color: #fff;
    }

    /* Player Face */
    .face {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
    }
    .face-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid white;
    }

    /* Stats Section */
    .stats {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .stat {
      display: flex;
      justify-content: space-between;
    }
    .stat-label {
      font-size: 14px;
      opacity: 0.8;
    }
    .stat-value {
      font-size: 18px;
      font-weight: bold;
    }

    /* Win Rate Bar */
    .winrate {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .winrate-bar {
      margin-top: 8px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d5c8, #ffb000);
    }
    .winrate-percentage {
      font-size: 14px;
      font-weight: bold;
      text-align: right;
    }

    /* Custom Badges Section */
    .badges {
      padding: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.35);
    }

    /* Rank Badge */
    .rank-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rank-badge img {
      width: 40px;
      height: 40px;
    }
    .rank-number {
      margin-left: 5px;
      font-size: 14px;
      font-weight: 800;
      color: white;
    }

    /* Tier Colors */
    .tier-champion { --tierA: #ffb000; --tierB: #b30000; --glow: rgba(255,140,0,.35); }
    .tier-masters { --tierA: #9b4eeb; --tierB: #5f2c90; --glow: rgba(155,78,255,.3); }
    .tier-diamond { --tierA: #e8fbff; --tierB: #4cc9ff; --glow: rgba(80,200,255,.3); }
    .tier-platinum { --tierA: #00d5c8; --tierB: #0a6f77; --glow: rgba(0,213,200,.28); }
    .tier-gold { --tierA: #ffd34d; --tierB: #8a5a00; --glow: rgba(255,211,77,.26); }
    .tier-silver { --tierA: #cfd6dd; --tierB: #3a4652; --glow: rgba(207,214,221,.2); }
    .tier-bronze { --tierA: #d59a6f; --tierB: #5a2f18; --glow: rgba(213,154,111,.2); }
  </style>
</head>

<body>
  <div class="player-card tier-champion">
    <!-- Top: Banner + Face + Player Name -->
    <div class="banner">
      <!-- Placeholder for Banner Art -->
      <img src="https://via.placeholder.com/300x160" alt="Banner Art" class="banner-img"/>
      <div class="player-name">
        <span>Matt Latour</span>
      </div>
      <div class="clan-team">
        <span class="clan-name" style="color: rgb(255,22,22);">Great Personality</span> <!-- Clan with color -->
        <span class="team-name" style="color: rgb(255,22,22);">Yin & Yang</span> <!-- Team with color -->
      </div>
      <div class="face">
        <!-- Placeholder for Player Face -->
        <img src="https://via.placeholder.com/100" alt="Player Face" class="face-img"/>
      </div>
    </div>

    <!-- Stats Section (Yellow) -->
    <div class="stats">
      <div class="stat">
        <span class="stat-label">Wins</span>
        <span class="stat-value">52</span>
      </div>
      <div class="stat">
        <span class="stat-label">Losses</span>
        <span class="stat-value">22</span>
      </div>
      <div class="stat">
        <span class="stat-label">Games</span>
        <span class="stat-value">74</span>
      </div>
      <div class="stat">
        <span class="stat-label">ELO</span>
        <span class="stat-value">2550</span>
      </div>
    </div>

    <!-- Win % Bar (at the bottom) -->
    <div class="winrate">
      <div class="winrate-bar">
        <div class="bar-fill" style="width: 70.3%"></div>
      </div>
      <div class="winrate-percentage">70.3%</div>
    </div>

    <!-- Customizable Badges Section (Purple) -->
    <div class="badges" style="background: rgba(255, 255, 255, 0.1);">
      <!-- Placeholder for badges -->
      <div class="badge">Champion Badge</div>
      <div class="badge">Godly Badge</div>
    </div>

    <!-- Rank Badge (Green) -->
    <div class="rank-badge">
      <!-- Placeholder for rank icon -->
      <img src="rank-badge-champion.jpg" alt="Rank Badge"/>
      <div class="rank-number">#1</div>
    </div>
  </div>

  <script>
    // Dynamic Data Loading Example (mock)
    fetch("leaderboard.json")
      .then(r => r.json())
      .then(d => {
        const PLAYER = d.players[0]; // Just an example for now
        document.querySelector('.player-name span').textContent = PLAYER.name;
        document.querySelector('.clan-name').textContent = PLAYER.clan;
        document.querySelector('.team-name').textContent = PLAYER.team;
        document.querySelector('.stat-value:nth-child(1)').textContent = PLAYER.wins;
        document.querySelector('.stat-value:nth-child(2)').textContent = PLAYER.losses;
        document.querySelector('.stat-value:nth-child(3)').textContent = PLAYER.games;
        document.querySelector('.stat-value:nth-child(4)').textContent = PLAYER.elo;
        document.querySelector('.bar-fill').style.width = `${(PLAYER.wins / PLAYER.games) * 100}%`;
      });
  </script>
</body>
</html>
