<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beerball Player Cards</title>

  <style>
    /* Overall Card */
    .player-card {
      width: 350px;
      height: 650px;
      background: #181818;
      color: white;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      font-family: 'Arial', sans-serif;
      display: flex;
    }

    /* Left Side: Player Info and Stats */
    .left-side {
      flex: 1; /* Takes half of the space */
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Right Side: Rank Badge */
    .right-side {
      width: 100px; /* Set fixed width for right side */
      background-color: #444; /* Gray background for the right side */
      display: flex;
      justify-content: center;
      align-items: flex-end; /* Align content to the bottom */
      position: relative;
      padding: 20px;
    }

    /* Rank Badge */
    .rank-badge {
      width: 80px;
      height: 80px;
      background-color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      position: absolute;
      bottom: 20px; /* Position it at the bottom-right */
    }

    .rank-badge img {
      width: 50px;
      height: 50px;
    }
  </style>
</head>

<body>
  <div class="player-card">
    <!-- Left Side: Player Info and Stats -->
    <div class="left-side">
      <div class="player-name">Matt Latour</div>
      <div class="clan-team">
        <span class="clan-name">Great Personality</span>
        <span class="team-name">Yin & Yang</span>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Games Played</span>
          <span class="stat-value">74</span>
        </div>
        <div class="stat">
          <span class="stat-label">Wins</span>
          <span class="stat-value">52</span>
        </div>
        <div class="stat">
          <span class="stat-label">Losses</span>
          <span class="stat-value">22</span>
        </div>
        <div class="stat">
          <span class="stat-label">ELO</span>
          <span class="stat-value">2550</span>
        </div>
      </div>

      <div class="winrate">
        <div class="winrate-bar">
          <div class="bar-fill" style="width: 70.3%"></div>
        </div>
        <div class="winrate-percentage">70.3%</div>
      </div>
    </div>

    <!-- Right Side: Rank Badge -->
    <div class="right-side">
      <div class="rank-badge">
        <img src="Icons/champion.jpg" alt="Rank Badge"/>
      </div>
    </div>
  </div>
</body>
</html>
