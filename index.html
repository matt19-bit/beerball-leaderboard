<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clan Leaderboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .clan-section {
            background-color: #fff;
            margin: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .clan-section h2 {
            color: #007BFF;
        }

        .clan-section ul {
            list-style-type: none;
            padding: 0;
        }

        .clan-section li {
            padding: 5px;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .player-list {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Clan Leaderboard</h1>
    <div id="leaderboard"></div>

    <script>
        // Fetch the leaderboard data from the JSON file
        fetch('leaderboard.json')
            .then(response => response.json())
            .then(data => {
                let leaderboard = document.getElementById('leaderboard');

                // Iterate over the clans and display them
                data.clans.forEach(clan => {
                    let clanSection = document.createElement('section');
                    clanSection.classList.add('clan-section');
                    clanSection.innerHTML = `
                        <h2 style="color: ${clan.color};">${clan.name}</h2>
                        <p><strong>Clan Color:</strong> ${clan.color}</p>
                        <h3>Players</h3>
                        <ul class="player-list">
                            ${data.players.filter(player => player.clan === clan.name)
                                          .map(player => `
                                            <li>
                                                <strong>${player.name}</strong> (Rank: ${player.rank})<br>
                                                Elo: ${player.elo}, Wins: ${player.wins}, Games: ${player.games}
                                            </li>`).join('')}
                        </ul>
                    `;
                    leaderboard.appendChild(clanSection);
                });
            })
            .catch(error => console.error('Error loading leaderboard data:', error));
    </script>

</body>
</html>
