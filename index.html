<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beerball Player Cards</title>

  <style>
    /* Overall Card */
    .player-card {
      width: 350px;
      height: 650px;
      background: #181818;
      color: white;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: row;
    }

    /* Left Side: Player Info and Stats */
    .left-side {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Player Name, Clan, and Team Name */
    .player-name {
      font-size: 24px;
      font-weight: bold;
      color: white;
      text-align: center;
    }

    .clan-team {
      font-size: 14px;
      color: #b0b0b0;
      text-align: center;
    }

    .clan-name {
      display: block;
      font-weight: bold;
    }

    .team-name {
      font-style: italic;
    }

    /* Badges Section (Positioned to form a triangle) */
    .badges {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      width: 100%;
    }

    .badge {
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      color: white;
      position: relative;
    }

    /* Position Badge 2 (centered) */
    .badge-2 {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Stats Section */
    .stats {
      padding: 0 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 40px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
    }

    /* Win Rate Bar */
    .winrate {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .winrate-bar {
      margin-top: 8px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d5c8, #ffb000);
    }

    .winrate-percentage {
      font-size: 14px;
      font-weight: bold;
      text-align: right;
    }

    /* Right Side: Rank Badge */
    .right-side {
      width: 100px;
      background: #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }

    /* Rank Badge */
    .rank-badge {
      width: 80px;
      height: 80px;
      background-color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .rank-badge img {
      width: 50px;
      height: 50px;
    }

    /* Tier Colors */
    .tier-champion { --tierA: #ffb000; --tierB: #b30000; --glow: rgba(255,140,0,.35); }
    .tier-masters { --tierA: #9b4eeb; --tierB: #5f2c90; --glow: rgba(155,78,255,.3); }
    .tier-diamond { --tierA: #e8fbff; --tierB: #4cc9ff; --glow: rgba(80,200,255,.3); }
    .tier-platinum { --tierA: #00d5c8; --tierB: #0a6f77; --glow: rgba(0,213,200,.28); }
    .tier-gold { --tierA: #ffd34d; --tierB: #8a5a00; --glow: rgba(255,211,77,.26); }
    .tier-silver { --tierA: #cfd6dd; --tierB: #3a4652; --glow: rgba(207,214,221,.2); }
    .tier-bronze { --tierA: #d59a6f; --tierB: #5a2f18; --glow: rgba(213,154,111,.2); }
  </style>
</head>

<body>
  <div class="player-card">
    <!-- Left Side: Player Info and Stats -->
    <div class="left-side">
      <div class="player-name">Matt Latour</div>
      <div class="clan-team">
        <span class="clan-name">Great Personality</span>
        <span class="team-name">Yin & Yang</span>
      </div>

      <!-- Badges Section -->
      <div class="badges">
        <div class="badge">Badge 1</div>
        <div class="badge badge-2">Badge 2</div>
        <div class="badge">Badge 3</div>
      </div>

      <!-- Win Rate Bar -->
      <div class="winrate">
        <div class="winrate-bar">
          <div class="bar-fill" style="width: 70.3%"></div>
        </div>
        <div class="winrate-percentage">70.3%</div>
      </div>

      <!-- Stats Section -->
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Games Played</span>
          <span class="stat-value">74</span>
        </div>
        <div class="stat">
          <span class="stat-label">Wins</span>
          <span class="stat-value">52</span>
        </div>
        <div class="stat">
          <span class="stat-label">Losses</span>
          <span class="stat-value">22</span>
        </div>
        <div class="stat">
          <span class="stat-label">ELO</span>
          <span class="stat-value">2550</span>
        </div>
      </div>
    </div>

    <!-- Right Side: Rank Badge -->
    <div class="right-side">
      <div class="rank-badge">
        <img src="Icons/champion.jpg" alt="Rank Badge"/>
      </div>
      <div class="rank-number">#1</div>
    </div>
  </div>
</body>
</html>
