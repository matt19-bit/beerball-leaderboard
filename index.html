<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beerball Player Cards</title>

  <style>
    /* Overall Card */
    .player-card {
      width: 350px;
      height: 650px;
      background: #181818;
      color: white;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: row;
    }

    /* Left Side: Player Info and Stats */
    .left-side {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Player Name, Clan, and Team Name */
    .player-name {
      font-size: 24px;
      font-weight: bold;
      color: white;
    }

    .clan-team {
      font-size: 14px;
      color: #b0b0b0;
      text-align: center;
    }

    .clan-name {
      display: block;
      font-weight: bold;
    }

    .team-name {
      font-style: italic;
    }

    /* Badges Section (Placeholder) */
    .badges {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .badge {
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      color: white;
    }

    /* Stats Section */
    .stats {
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
    }

    /* Win % Bar */
    .winrate {
      margin-top: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .winrate-bar {
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d5c8, #ffb000);
    }

    .winrate-percentage {
      font-size: 14px;
      font-weight: bold;
      text-align: right;
    }

    /* Right Side: Rank Badge */
    .right-side {
      width: 100px;
      background: #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }

    .rank-badge {
      width: 80px;
      height: 80px;
      background-color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .rank-badge img {
      width: 50px;
      height: 50px;
    }

    /* For the Diamond, Champion, etc. Badge */
    .badge-diamond {
      background-color: rgb(0, 51, 153);
    }
    .badge-champion {
      background-color: rgb(255, 22, 22);
    }
    .badge-gold {
      background-color: rgb(255, 211, 77);
    }
    .badge-silver {
      background-color: rgb(191, 191, 191);
    }
    .badge-platinum {
      background-color: rgb(0, 213, 200);
    }
  </style>
</head>

<body>
  <div class="player-card">
    <!-- Left Side: Player Info and Stats -->
    <div class="left-side">
      <!-- Player Info -->
      <div class="player-name">Matt Latour</div>
      <div class="clan-team">
        <span class="clan-name">Great Personality</span>
        <span class="team-name">Yin & Yang</span>
      </div>

      <!-- Badges Section -->
      <div class="badges">
        <div class="badge">Badge 1</div>
        <div class="badge">Badge 2</div>
        <div class="badge">Badge 3</div>
      </div>

      <!-- Win Rate Bar -->
      <div class="winrate">
        <div class="winrate-bar">
          <div class="bar-fill" style="width: 70.3%"></div>
        </div>
        <div class="winrate-percentage">70.3%</div>
      </div>

      <!-- Stats Section -->
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Games Played</span>
          <span class="stat-value">74</span>
        </div>
        <div class="stat">
          <span class="stat-label">Wins</span>
          <span class="stat-value">52</span>
        </div>
        <div class="stat">
          <span class="stat-label">Losses</span>
          <span class="stat-value">22</span>
        </div>
        <div class="stat">
          <span class="stat-label">ELO</span>
          <span class="stat-value">2550</span>
        </div>
      </div>
    </div>

    <!-- Right Side: Rank Badge -->
    <div class="right-side">
      <div class="rank-badge badge-champion">
        <img src="Icons/champion.jpg" alt="Rank Badge"/>
      </div>
      <div class="rank-number">#1</div>
    </div>
  </div>
</body>
</html>
