<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
</head>
<body>
    <h1>Clan Leaderboard</h1>
    <div id="leaderboard"></div>

    <script>
        // Fetch the leaderboard data from the JSON file
        fetch('leaderboard.json')
            .then(response => response.json())
            .then(data => {
                let leaderboard = document.getElementById('leaderboard');
                
                data.clans.forEach(clan => {
                    // Create a section for each clan
                    let clanSection = document.createElement('section');
                    clanSection.innerHTML = `
                        <h2>${clan.name}</h2>
                        <img src="${clan.logo}" alt="${clan.name} Logo">
                        <p>Win %: ${clan['Win %']}</p>
                        <p>Average Elo: ${clan['Average Elo']}</p>
                        <p>Total Elo: ${clan['Total Elo']}</p>
                        <p>Games Played: ${clan['Games Played']}</p>
                        <p>Ranking: ${clan.Ranking}</p>
                        <h3>Players</h3>
                        <ul>
                            ${clan.Players.map(player => `<li>${player.name}: Elo = ${player.elo}, Wins = ${player.wins}, Games Played = ${player.games}</li>`).join('')}
                        </ul>
                    `;
                    leaderboard.appendChild(clanSection);
                });
            })
            .catch(error => console.error('Error loading leaderboard data:', error));
    </script>
</body>
</html>
